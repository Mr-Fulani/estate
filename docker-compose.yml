services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-estate}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-estate_secret}
      POSTGRES_DB: ${DB_NAME:-estate_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-estate} -d ${DB_NAME:-estate_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-estate}:${DB_PASSWORD:-estate_secret}@db:5432/${DB_NAME:-estate_db}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - ./frontend/.env
    environment:
      INTERNAL_API_URL: http://api:8000/api/v1
      NEXT_DIST_DIR: .next-dev
    depends_on:
      - api

volumes:
  postgres_data:
